services:

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    depends_on:
      - postgres
    ports:
      - "${MACHINE_ADMINER_PORT}:${ADMINER_PORT}"
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  postgres:
    build: backend/postgres-dev/
    container_name: postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    restart: always
    volumes:
      - ./backend/db_data/:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  content:
    build: backend/content
    container_name: content
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${CONTENT_PORT}:${CONTENT_PORT}"
    volumes:
      - ./backend/uploads/:/app/uploads
    environment:
      PORT: ${CONTENT_PORT}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
      UPLOAD_DIR: /app/uploads
